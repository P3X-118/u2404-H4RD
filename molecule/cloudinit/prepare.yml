---
- name: Prepare
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install basic dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - sudo
          - curl
          - gnupg
          - git
          - jq
          - openssh-client
          - cloud-init
          - cloud-utils
        state: present

    - name: Setup cloud-init seed directory
      ansible.builtin.file:
        path: /var/lib/cloud/seed/nocloud
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Create cloud-init user-data
      ansible.builtin.copy:
        content: |
          #cloud-config
          users:
            - name: ubuntu
              primary_group: ubuntu
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...
          packages:
            - vim
            - curl
            - wget
        dest: /var/lib/cloud/seed/nocloud/user-data
        mode: '0644'
        owner: root
        group: root

    - name: Create cloud-init meta-data
      ansible.builtin.copy:
        content: |
          instance-id: molecule-cloudinit
          local-hostname: ubuntu-hardened
        dest: /var/lib/cloud/seed/nocloud/meta-data
        mode: '0644'
        owner: root
        group: root
