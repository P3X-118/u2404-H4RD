---
- name: Converge
  hosts: all
  gather_facts: true
  become: true

  vars:
    skip_reboot: true
    ubtu24stig_cat1: false
    ubtu24stig_cat2: true
    ubtu24stig_cat3: true

  roles:
    - role: ..
      # Skip rules that require reboot or are problematic in container
      ubtu24stig_102000: false  # Bootloader - not applicable in container
      ubtu24stig_100030: false  # IP forwarding - not applicable
      ubtu24stig_100040: false  # Packet redirecting - not applicable
